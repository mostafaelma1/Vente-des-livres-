name: Build APK

on:
  push:
    branches:
      - "claude/book-sales-management-app-y4n0x9"
      - "claude/salary-management-app-ynxixj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VenteLivres-debug.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenteLivres-debug-apk
          path: dist/VenteLivres-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: VenteLivres APK (build ${{ github.run_number }})
          body: |
            Debug APK built from `${{ github.sha }}`.
            Download **VenteLivres-debug.apk** below, then sideload it on an
            Android device (enable "Install unknown apps").
          files: dist/VenteLivres-debug.apk
